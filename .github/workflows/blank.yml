name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      shell: pwsh
      run: |
        Write-Host "=== ENIGMANO WINDOWS DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow

        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan

        $os = Get-CimInstance Win32_OperatingSystem
        $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1

        $build = [int]$os.BuildNumber
        $memoryGB = [math]::Round(
          $os.TotalVisibleMemorySize / 1MB,
          2
        )

        Write-Host "Windows Product: $($os.Caption)" -ForegroundColor White
        Write-Host "Windows Version: $($os.Version)" -ForegroundColor White
        Write-Host "Windows Build: $build" -ForegroundColor White
        Write-Host "Architecture: $($os.OSArchitecture)" -ForegroundColor White
        Write-Host "Memory: $memoryGB GB" -ForegroundColor White

        Write-Host "`n=== PROCESSOR ===" -ForegroundColor Cyan
        Write-Host "CPU: $($cpu.Name)" -ForegroundColor White
        Write-Host "Cores: $($cpu.NumberOfCores)" -ForegroundColor White
        Write-Host "Logical Processors: $($cpu.NumberOfLogicalProcessors)" -ForegroundColor White

        Write-Host "`n=== WINDOWS 11 26H2 CHECK ===" -ForegroundColor Cyan

        if ($build -eq 26300) {
          Write-Host "Windows 11 26H2 — Build 26300 DETECTED." -ForegroundColor Green
          Write-Host "STATUS: TARGET BUILD CONFIRMED" -ForegroundColor Green
        }
        else {
          Write-Host "Windows 11 26H2 Build 26300 NÃO foi detectado." -ForegroundColor Yellow
          Write-Host "BUILD REAL DO RUNNER: $build" -ForegroundColor Yellow
          Write-Host "O GitHub controla a imagem do windows-latest." -ForegroundColor Yellow
        }

    - name: Install Google Chrome (Direct)
      shell: pwsh
      run: |
        Write-Host "Downloading Google Chrome..." -ForegroundColor Green

        $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
        $installerPath = "$env:TEMP\chrome_installer.exe"

        Invoke-WebRequest `
          -Uri $chromeUrl `
          -OutFile $installerPath

        Write-Host "Installing Google Chrome silently..." -ForegroundColor Green

        Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/silent /install" `
          -Wait

        Remove-Item $installerPath -Force

        Write-Host "Google Chrome installed!" -ForegroundColor Green

    - name: Install 7-Zip (Direct)
      shell: pwsh
      run: |
        Write-Host "Downloading 7-Zip..." -ForegroundColor Green

        $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
        $installerPath = "$env:TEMP\7z-installer.exe"

        Invoke-WebRequest `
          -Uri $zipUrl `
          -OutFile $installerPath

        Write-Host "Installing 7-Zip silently..." -ForegroundColor Green

        Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/S" `
          -Wait

        Remove-Item $installerPath -Force

        Write-Host "7-Zip installed!" -ForegroundColor Green

    - name: Final System Verification
      shell: pwsh
      run: |
        Write-Host "`n=== FINAL SYSTEM VERIFICATION ===" -ForegroundColor Cyan

        $os = Get-CimInstance Win32_OperatingSystem
        $build = [int]$os.BuildNumber

        Write-Host "Operating System: $($os.Caption)" -ForegroundColor White
        Write-Host "Version: $($os.Version)" -ForegroundColor White
        Write-Host "Build: $build" -ForegroundColor White

        if ($build -eq 26300) {
          Write-Host "`nWindows 11 26H2 — Build 26300 CONFIRMED." -ForegroundColor Green
        }
        else {
          Write-Host "`nBuild 26300 não está disponível neste runner." -ForegroundColor Yellow
          Write-Host "Build encontrada: $build" -ForegroundColor Yellow
        }

        Write-Host "`n=== WORKFLOW COMPLETED ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor White
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor White
